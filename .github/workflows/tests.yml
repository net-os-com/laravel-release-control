name: Tests

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  php:
    name: Laravel ${{ matrix.laravel }} / Guzzle ${{ matrix.guzzle }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - laravel: '^12.0'
            guzzle: '^7.10'
          - laravel: '^13.0'
            guzzle: '^8.0'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
      - run: composer validate --strict
      - run: >-
          composer update --no-interaction --prefer-dist --no-progress
          --with 'laravel/framework:${{ matrix.laravel }}'
          --with 'guzzlehttp/guzzle:${{ matrix.guzzle }}'
      - run: composer test
